services:
  app:
    image: ghcr.io/example-org/example-app:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - app_data:/app/data

volumes:
  app_data:
